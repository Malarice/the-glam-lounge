<body>
    <!-- ============================================ -->
    <!--                 Navigation                   -->
    <!-- ============================================ -->
    <div id="navbar"></div>
<div id="banner-712">
    <div class="cs-container">
        <span class="cs-int-title">Contact</span>
    </div>

    <picture class="cs-background">
        <source media="(max-width: 600px)" srcset="assets/images/salon-background.webp">
        <source media="(min-width: 601px)" srcset="assets/images/salon-background.webp">
        <img loading="lazy" decoding="async" src="assets/images/salon-background.webp" alt="Contact The Glam Lounge" width="1280" height="568" aria-hidden="true">
    </picture>
</div>

                   <!-- ============================================ -->
<!--                   Contact                    -->
<!-- ============================================ -->

<section id="contact-569">
    <div class="cs-container">
        <div class="cs-left">
            <div class="cs-content">
                <span class="cs-topper">Book Your Glam</span>
                <h2 class="cs-title">Reserve Your Spot</h2>
                <p class="cs-text">
                    Fill out the form below and we'll confirm your appointment within 24 hours.
                </p>
            </div>

            <!--Form-->
            <form class="cs-form" id="cs-form-569" name="Contact Form" method="post">

                <label class="cs-label">
                    Full Name
                    <input class="cs-input" required type="text" id="name-569" name="name" placeholder="Your name">
                </label>

                <label class="cs-label">
                    Phone Number
                    <input class="cs-input" required type="text" id="phone-569" name="phone" placeholder="(555) 000-0000">
                </label>

                <label class="cs-label">
                    Email Address
                    <input class="cs-input" required type="email" id="email-569" name="email" placeholder="your@email.com">
                </label>

                <!-- ⭐ NEW SERVICE DROPDOWN -->
                <label class="cs-label">
                    Service
                    <select class="cs-input" required id="service-569" name="service">
                        <option value="">Select a service...</option>
                        <option value="soft-glam">Soft Glam</option>
                        <option value="full-glam">Full Glam</option>
                        <option value="prom-glam">Prom Glam</option>
                        <option value="birthday-glam">Birthday Glam</option>
                        <option value="bridal-trial">Bridal Trial</option>
                        <option value="bridal-glam">Bridal Glam</option>
                        <option value="braids">Braids</option>
                        <option value="wig-install">Wig Install</option>
                        <option value="loc-retwist">Loc Retwist</option>
                        <option value="starter-locs">Starter Locs</option>
                    </select>
                </label>

                <label class="cs-label">
                    Preferred Date
                    <input class="cs-input" required type="text" id="date-569" name="date" placeholder="mm/dd/yyyy">
                </label>

                <label class="cs-label cs-message">
                    Additional Details
                    <textarea class="cs-input cs-textarea" required name="Message" id="message-569" placeholder="Tell us more about your look, occasion, or any questions..."></textarea>
                </label>

                <button class="cs-submit" type="submit">Book Now</button>
            </form>
        </div>

        <div class="cs-right">
            <div class="cs-flex">
                <span class="cs-header">Our Location</span>
                <a href="" class="cs-link">Newnan, GA<br> United States</a>
            </div>

            <div class="cs-flex">
                <span class="cs-header">Quick Contacts</span>
                <a href="" class="cs-link">info@glamloungebeauty.com</a>
                <a href="tel:555-689-9566" class="cs-link cs-phone">+1 (555) 686-9566</a>
            </div>

            <ul class="cs-social">
                <li class="cs-li"><a class="cs-social-link" href=""><img class="cs-icon" src="/assets/svgs/tiktok.svg" width="18"></a></li>
                <li class="cs-li"><a class="cs-social-link" href=""><img class="cs-icon" src="/assets/svgs/facebook.svg" width="10"></a></li>
                <li class="cs-li"><a class="cs-social-link" href=""><img class="cs-icon" src="/assets/svgs/instagram.svg" width="16"></a></li>
                <li class="cs-li"><a class="cs-social-link" href=""><img class="cs-icon" src="/assets/svgs/youtube.svg" width="21"></a></li>
            </ul>
        </div>
    </div>
</section>
